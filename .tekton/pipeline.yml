apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: run-tests
      taskRef:
        name: nose-tests
      runAfter:
        - cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace