---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose-tests
spec:
  workspaces:
    - name: source
  steps:
    - name: install
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        npm ci
    - name: test
      image: node:20
      workingDir: $(workspaces.source.path)
      script: |
        npm test